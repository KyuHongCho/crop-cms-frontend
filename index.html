<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Crop CMS</title>
    <meta name="description" content="Ask crop-growing questions and read answers with the source documents alongside them." />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Crop CMS" />
    <meta property="og:description" content="Ask crop-growing questions and read answers with the source documents alongside them." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      try {
        var t = localStorage.getItem("crop-cms-theme");
        var dark = t === "dark" || (t !== "light" && !!window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Crop CMS needs JavaScript. Please turn it on and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
