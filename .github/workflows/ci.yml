name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The default is already read-only for this repo; stating it keeps a settings change from widening it.
permissions:
  contents: read

jobs:
  # The name `checks` is what branch protection requires; renaming the job breaks the rule.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the one place the Node version lives, so a laptop and CI cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` refuses to run when package.json and package-lock.json disagree, so a dependency
      # change that skipped the lockfile fails here instead of resolving to something new.
      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Actions sets CI=true, which makes vitest fail on a committed `.only` instead of silently
      # skipping the rest of its file. (Vitest exits 1 on "no tests found" with or without CI.)
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  # Advisory: not in branch protection. Linux and --with-deps are unproven until the first run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Browsers are cached but the system libraries are not, so the deps step runs on a cache hit.
      - name: Install browsers and their system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install system libraries only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Fails when the backend's main serves an API the committed src/api/schema.d.ts does not match.
  # Not a required check: it also goes red when the backend changes a route this app never calls.
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: KyuHongCho/crop-cms-backend
          path: crop-cms-backend

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: crop-cms-backend/requirements.txt

      - name: Install the backend's pinned requirements
        working-directory: crop-cms-backend
        run: pip install -r requirements.txt

      # Importing the app reads DB_PASSWORD but opens no connection. Natural key order, NOT
      # sort_keys: sorting reorders the generated types and reports a false "stale".
      - name: Dump the OpenAPI document from the backend's committed code
        working-directory: crop-cms-backend
        env:
          DB_PASSWORD: ci-throwaway
        run: python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > "$RUNNER_TEMP/openapi.json"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Committed types match that API
        env:
          OPENAPI_SRC: ${{ runner.temp }}/openapi.json
        run: npm run check:api
